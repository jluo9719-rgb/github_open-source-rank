name: Update Trending Data

on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = 北京时间 08:00
  workflow_dispatch: # 允许在 GitHub 页面手动触发

permissions:
  contents: write # 必须开启，否则无法自动 commit 推送

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch GitHub trending repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch.py

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "chore: update trending data" && git push)